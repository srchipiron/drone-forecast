# Pruebas en cada PR; en main (y cada 6 horas, para refrescar órbitas y Kp)
# pasa las pruebas, baja los datos y publica en GitHub Pages.
# Si algo falla, se detiene y Pages se queda con la versión anterior.
name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test

  # La prueba de navegador, solo en los PR (las mejoras diarias la pasan
  # antes de llegar a main). Publicar no depende de ella.
  interfaz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - run: PLAYWRIGHT_CHROME="$(command -v google-chrome)" npm run test:ui

  publicar:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bajar órbitas GNSS y Kp
        env:
          PREVIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: npm run datos
      - name: Preparar lo que se publica
        run: |
          mkdir -p _site
          cp -r index.html styles.css sw.js manifest.webmanifest icons src data _site/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
